[project]
name = "northforge"
version = "0.1.0"
description = "NorthForge: supervised AI workflow runtime for contract and policy review."
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "asyncpg>=0.29",
  "redis>=5.0",
  "arq>=0.26",
  "sqlalchemy[asyncio]>=2.0",
  "alembic>=1.13",
  "pyjwt[crypto]>=2.9",
  "aiobotocore>=2.15",
  "httpx2>=2.13.0",
  "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-aiobotocore[s3]>=3.9.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["northforge"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["northforge", "tests"]

[[tool.mypy.overrides]]
module = ["asyncpg", "asyncpg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires live PostgreSQL and Redis (set NORTHFORGE_INTEGRATION=1)",
]
