# Local development dependencies for NorthForge.
# Start:  docker compose up -d
# Stop:   docker compose down          (keeps data)
# Reset:  docker compose down -v       (destroys local data; never run against shared databases)
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: northforge-postgres
    environment:
      POSTGRES_USER: northforge
      POSTGRES_PASSWORD: northforge
      POSTGRES_DB: northforge
    ports:
      # Host port defaults to 5433 so a locally installed PostgreSQL on 5432 is not shadowed.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U northforge -d northforge"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: northforge-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio no longer exists on Docker Hub; the maintainers publish to
    # quay.io. Tag pinned to the same release the design specified.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: northforge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: northforge
      MINIO_ROOT_PASSWORD: northforge-secret
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
