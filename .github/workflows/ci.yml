name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: northforge
          POSTGRES_PASSWORD: northforge
          POSTGRES_DB: northforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U northforge -d northforge"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      minio:
        # GitHub Actions service containers always run their image's default
        # entrypoint/command with no way to append `server /data` here (there
        # is no `command:` key for service containers), so the plain
        # `quay.io/minio/minio` image used by docker-compose.yml -- which
        # requires that argument -- cannot be used directly in CI.
        # `bitnami/minio` ships a default command that starts the server
        # from MINIO_ROOT_USER/MINIO_ROOT_PASSWORD alone, so CI uses it only
        # for that reason; it is API-compatible with the MinIO used locally
        # and in production. Bitnami moved its actively updated images
        # behind a paid catalog in 2025; `bitnamilegacy/minio` is the frozen,
        # still-public image Bitnami published for exactly this transition.
        image: bitnamilegacy/minio:latest
        ports: ["9000:9000"]
        env:
          MINIO_ROOT_USER: northforge
          MINIO_ROOT_PASSWORD: northforge-secret
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      AUTH_MODE: dev
      DATABASE_URL: postgresql://northforge:northforge@localhost:5432/northforge
      REDIS_URL: redis://localhost:6379/0
      NORTHFORGE_TEST_DATABASE_URL: postgresql://northforge:northforge@localhost:5432/northforge_test
      NORTHFORGE_INTEGRATION: "1"
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: northforge
      S3_ACCESS_KEY: northforge
      S3_SECRET_KEY: northforge-secret
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run alembic upgrade head
      - name: dataset (regeneration must be byte-identical to the committed corpus)
        run: |
          uv run python -m northforge.data.synthetic --out data/synthetic --seed 20260916 --version v1
          git diff --exit-code -- data/synthetic
      - run: uv run pytest -q

  frontend:
    name: Frontend (prettier, eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  contracts:
    name: Contracts (generated frontend types match the backend OpenAPI schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv python install 3.12
        working-directory: backend
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run python -m northforge.api.export_openapi
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run generate:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/openapi.json frontend/src/lib/api-schema.d.ts
